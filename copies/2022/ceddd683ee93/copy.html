class=body-text><html><body><p>A pochi giorni dall’invasione russa dell’Ucraina in Italia si è accesa la discussione sugli antivirus. La questione riguarda nuovamente il caso <strong>Kaspersky</strong> e il suo utilizzo all’interno dei nostri confini nazionali. Pensante, da ultimo e soprattutto, il parare ieri di Franco <strong>Gabrielli</strong>, sottosegretario alla Presidenza del Consiglio con delega alla Sicurezza<strong> Nazionale, che invita a prendere le distanze dall’antivirus e in particolare ha chiesto di toglierlo dai server della PA, tema su cui si attende un decreto specifico.</strong></p><p>Kaspersky è utilizzato da 2.700 amministrazioni, tra ministeri, Comuni, forze dell’ordine e grandi aziende private.</p><p>Il punto: in virtù  degli eventi geopolitici, infatti, la <strong>Russia</strong> è diventata a tutti gli effetti una nazione nemica (alla quale vengono inflitte sanzioni sia da Stati Uniti che da Unione Europea) del nostro continente e quindi di conseguenza anche della nostra nazione.  </p><ul>
<li>Bisognerebbe quindi eliminare Kaspersky perché è associabile a un nemico?</li>
<li>Addirittura, si può temere che l’antivirus contenga un software spia o una backdoor del Governo russo, sospetto analogo a quello che da anni affligge Huawei?</li></ul><p>Interrogativi non facili.</p><p><strong>Se da una parte non è corretto identificare il Governo Russo con i russi o le aziende russe,</strong> dall’altra la situazione sul caso Kaspersky è particolarmente delicata. Cerchiamo di analizzarla.</p><div

class=ez-toc-section id=Levoluzione_della_discussione_su_Kaspersky></span>L’evoluzione della discussione su Kaspersky<span
class=ez-toc-section-end></span></h2><p>Ricordiamo com’è cominciata.</p><p>Il 27 febbraio Stefano Quintarelli, informatico ex deputato e da sempre in prima linea sul fronte innovazione digitale e pubblica amministrazione (ideatore di SPID), ha firmato un articolo su Il Post con il quale instrada una discussione, che presto diventerà di pubblico dominio, sul rapporto tra il software antivirus Kaspersky e l’Italia.</p><div><div

class="hb-form-wrapper " data-enabled=false data-portalid=3901390 data-formid=09e0681d-a619-4639-a976-19ef077240c3 data-forminstanceid=651622f8c473d2f5 data-target=#hb_form_target_651622f8c473d2f5 data-sfdccampaignid=7013Y000001yjMmQAI><div
class=hbspt-form id=hb_form_target_651622f8c473d2f5></div></div></div></div><p>Nella giornata seguente viene presentata, a livello politico, <a
href="https://aic.camera.it/aic/scheda.html?numero=4/11474&amp;ramo=CAMERA&amp;leg=18">un’interrogazione parlamentare</a> promossa dal deputato del Gruppo Misto Paolo Nicolò Romano, il cui contenuto spingerà a un gradino successivo la questione appena prima sollevata sul software Kaspersky.</p><p>A questo punto il centro del dibattito vede coinvolto un grande interrogativo: <strong>è giusto preoccuparsi per un software antivirus Made in Russia, utilizzato ormai da diversi anni in gran parte della pubblica amministrazione italiana, in un momento storico di tensione geopolitica della Russia nei confronti dell’occidente?</strong></p><p>Per rispondere, o meglio per avere gli strumenti utili a farci una personale idea della risposta a questo tema, bisogna analizzare alcuni dati fattuali. Nello specifico un software, qualsiasi esso sia (seppur a codice sorgente chiuso), è sempre conoscibile. Non è necessario leggere il codice sorgente per studiare il comportamento di un software durante la sua esecuzione. Altro elemento da considerare è che Kaspersky (azienda russa), è un’azienda molto strutturata, multinazionale e per i propri clienti europei, disloca i propri datacenter (nei quali sono contenuti i server che effettuano il lavoro di analisi richiesto dal software antivirus) in Svizzera.</p><h2><span
class=ez-toc-section id=Kaspersky_dallantivirus_russo_sabotaggio_allItalia_Il_timore></span>Kaspersky, dall’antivirus russo sabotaggio all’Italia? Il timore<span
class=ez-toc-section-end></span></h2><p>Come già detto Kaspersky è un’azienda con sede legale in Russia, questo è uno degli elementi di maggior esposizione delle preoccupazioni finora riportate sul tema. Oltre a questo si aggiungono riferimenti storici che vedono in Eugene Kaspersky (CEO e fondatore dell’omonima azienda), relazioni e legami, certamente riferiti ormai ad un lontano passato, con il KGB russo.</p><p>La crisi prodotta dall’invasione russa dell’Ucraina, ha notevolmente incrementato le preoccupazioni nei confronti del software antivirus prodotto da Kaspersky, in relazione al fatto che l’attuale governo russo (che giorno dopo giorno mette sempre più a rischio la propria reputazione democratica con l’intervento armato in Ucraina), per il tramite dei servizi di sicurezza statali, possa incidere sull’operato dell’azienda visto il settore strategico nel quale opera, al fine di operare del <strong>sabotaggio informatico o spionaggio</strong> contro i paesi (suoi clienti) non alleati alla Russia.</p><p>Questa ipotesi, che finora non riceve ancora alcun riscontro su lato pratico, lo spiega bene Corrado <strong>Giustozzi</strong>, esperto di cyber security al Corriere della Sera: “è plausibile che nel contesto attuale, l’azienda possa ricevere pressioni o minacce dal governo russo. Non penso tanto a uno scenario di spionaggio attivo, quando piuttosto a un malware creato dagli stessi russi che l’antivirus potrebbe volontariamente non rilevare e lasciar passare”.</p><p>Questo scenario dunque vedrebbe il diffondersi della minaccia informatica, mirata nei confronti delle strutture critiche italiane, agendo con tutte le capacità di un malware ed eventualmente se necessario esfiltrando dati riservati verso il paese nemico.</p><h3><span
class=ez-toc-section id=Gabrielli></span>Gabrielli<span
class=ez-toc-section-end></span></h3><p>A rincarare la dose, la questione arriva ai più alti vertici italiani. Come detto Franco <strong>Gabrielli</strong>, sottosegretario alla Presidenza del Consiglio con delega alla Sicurezza Nazionale, infatti sempre al Corriere della Sera rilascia il proprio commento secondo cui “dobbiamo liberarci da una dipendenza dalla tecnologia russa. Per esempio quella dei sistemi antivirus prodotti dei russi e utilizzati dalle nostre pubbliche amministrazioni, per evitare che da strumento di protezione possano diventare strumento di attacco”.</p><h3><span
class=ez-toc-section id=La_Francia></span>La Francia<span
class=ez-toc-section-end></span></h3><p>Analogamente in Francia l’Agenzia nazionale per la sicurezza dei sistemi informativi (Anssi) ha invitato a “mettere in discussione” l’uso del software Kaspersky, anche se un divieto esplicito ancora non c’è.</p><h3><span
class=ez-toc-section id=Usa_e_Olanda></span>Usa e Olanda<span
class=ez-toc-section-end></span></h3><p>Stati Uniti e Olanda invece hanno bandito Kaspersky dai computer governativi già cinque e quattro anni fa rispettivamente.</p><p></p><h2><span
class=ez-toc-section id=Il_parere_degli_esperti_sullantivirus_russo></span>Il parere degli esperti sull’antivirus russo<span
class=ez-toc-section-end></span></h2><p>Per aggiungere elementi utili a creare un quadro completo sulla vicenda, analizziamo i pareri tecnici degli esperti in merito all’utilizzo, in questa fase storica, dell’antivirus Kaspersky. Sempre <strong>Giustozzi</strong> evidenzia come il problema non sia fine a sé stesso, ma segua un’impronta più politica e di regolamentazione, non solo italiana ma addirittura europea, vista la complessità su cui si fonda la sicurezza. “Certi Stati hanno un potere di coercizione sulle aziende private, ma questo non vale solo per quelli non democratici. È giusto preoccuparsi anche del cloud che è tutto in mano a grandi nomi americani, così come dei sistemi operativi di pc e smartphone”.</p><p>Come vediamo, dunque, un problema che non coinvolge solo un software antivirus, ma gran parte della tecnologia che quotidianamente fa parte delle nostre vite e non tanto una questione tecnica ma molto orientata alla risoluzione politica tra Stati.</p><p>Dell’avviso abbastanza similare è anche Stefano <strong>Zanero</strong>, professore associato del Politecnico di Milano che, valutandone evidentemente i rischi, riferisce di recente a Open che “Il tema emerso in questi giorni su Kaspersky apre a un discorso più ampio che è quello della sovranità tecnologica. Quando parliamo di software o hardware che vengono utilizzati in sistemi critici, bisognerebbe garantire che queste tecnologie non abbiano dipendenze con nazioni che sono fuori dalle nostre alleanze. In alcuni casi non si può fare a meno di utilizzare tecnologie prodotte all’esterno ma per quanto riguarda l’antivirus abbiamo un’ampia scelta di prodotti. Questi software devono essere sempre aggiornati e hanno un flusso di dati costante con l’azienda che li ha sviluppati”.</p><h2><span
class=ez-toc-section id=Cosa_emerge_dal_dibattito_sul_potenziale_rischio_Kaspersky></span>Cosa emerge dal dibattito sul potenziale rischio Kaspersky?<span
class=ez-toc-section-end></span></h2><p>Ciò che possiamo concludere, assistendo a questo dibattito, che ormai ha raggiunto come abbiamo visto, la dimensione nazionale, viene identificato nel rapporto tra pubblica amministrazione italiana e tecnologia.</p><p>Pare proprio che, appunto, non ci sia in Italia una tradizione di sovranità tecnologica in ambito strategico, e il fatto che la questione venga sollevata in un momento storico così delicato sul fronte geopolitico, è emblematico. Va detto infatti che Fabio Pietrosanti, presidente del Centro Hermes per la Trasparenza e i Diritti Umani Digitali, sollevò la questione (senza poi un seguito concreto al lato pratico) già dal 2018 con un’inchiesta per Euronews nella quale evidenziava come Polizia, Carabinieri, Ministero dell’interno, Giustizia, Difesa, Servizi segreti, utilizzano e acquisiscono software antivirus Kaspersky.</p><p>Inoltre, a questi fatti si aggiunge l’analisi che pensiamo sia lecito esporre, non ancora presa in considerazione, secondo cui la stessa azienda Kaspersky operi per conto della pubblica amministrazione italiana, non solo vendita di software, ma soprattutto consulenza forense post attacco. Una pratica sempre più richiesta, vista anche l’incidenza degli attacchi ransomware rivolti a strutture strategiche del paese almeno negli ultimi due anni, che ci fa domandare <strong>se sia più preoccupante un software, conoscibile seppur closed, oppure un servizio di consulenza, affidato non a macchine ma a umani che di fatto vengono remunerati per scavare nei dettagli più profondi delle nostre infrastrutture tecnologiche?</strong></p><p>Difficile a questo punto non chiedersi come mai ci sia voluta una guerra e un’invasione guidata da principi del tutto anti democratici, a far scattare all’Italia il campanello d’allarme sulla questione Kaspersky, puntando peraltro unicamente al software antivirus che, al momento, non ha mai presentato indici di anomalia riferibili ai rischi potenziali esposti? E’ vero che la prevenzione è sempre più utile della cura di un male, però durante tutto il periodo pandemico la nostra pubblica amministrazione e nello specifico il settore sanitario, ha sofferto di grandi incidenti informatici, i quali più importanti, trattati proprio con i servizi forensi espletati anche da tecnici Kaspersky, oltre che la statunitense FBI.</p><h3><span
class=ez-toc-section id=La_risposta_di_Kaspersky></span>La risposta di Kaspersky<span
class=ez-toc-section-end></span></h3><p><strong>Dal canto suo l’azienda prende le distanze da queste accuse e ai media riferisce che</strong> “Kaspersky è una società internazionale privata e non ha legami con nessun governo o agenzia governativa. È orgogliosa di cooperare con le autorità di molti Paesi e con le forze dell’ordine internazionali nella lotta contro il crimine informatico”.</p><p>Anche noi abbiamo chiesto un parere all’azienda e lo attendiamo.</p><p>Inoltre, lo ricordiamo, Kaspersky svolge cooperazione, ormai quasi decennale, anche con Polizia Olandese, Europol e Intel Security, senza commento per il momento sulla questione emergente dalla guerra ucraina. Più di una volta ha cercato di dimostrare la propria indipendenza da Mosca, con la Global Transparency Initiative e poi con il trasferimento a Zurigo del datacenter.</p><h3><span
class=ez-toc-section id=E_lAgenzia_cyber_italiana></span>E l’Agenzia cyber italiana?<span
class=ez-toc-section-end></span></h3><p>Anche in Italia, al netto delle considerazioni fin qui esposte, manca un importante tassello sulla questione antivirus.</p><p>Sarà infatti determinante un eventuale commento della neonata ACN (Agenzia per la Cybersecurity Nazionale), ancora non espresso sulla vicenda, ma possiamo immaginare, visti i recenti sviluppi di transizione digitale e sicurezza informatica, tanto auspicato dalla nostra pubblica amministrazione. Probabilmente arriverà nei prossimi giorni, forse affiancato da un decreto specifico rivolto alla PA.</p><p></p><blockquote><p>“L’Agenzia credo abbia già deciso, perché ha deciso il piano di sopra: Gabrielli”, dice Quintarelli a Cybersecurity360.it.</p></blockquote><p></p></body></html>		<span
